name: Run PR approval gate patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Apply one-shot patch
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-pr-approval-gate.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code, 'apply-pr-approval-gate.py', 'exec'), {'__name__': '__main__'})
          PYTHON

          rm -f .github/workflows/run-pr-approval-patch.yml

          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path

          root = Path('.')
          lines = []
          for path in sorted(root.rglob('*'), key=lambda p: p.as_posix()):
              if not path.is_file() or '.git' in path.parts or path.as_posix() == 'CHECKSUMS.txt':
                  continue
              lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  ./{path.as_posix()}")
          Path('CHECKSUMS.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          PYTHON

          python3 scripts/validate_skill.py SKILL.md
          python3 scripts/validate_skill.py standalone/SKILL.md
          bash tests/test_installers.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: require user approval before PR delivery"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
