name: Refine PR approval gate

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Apply consistency fixes
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          replace_once(
              'SKILL.md',
              '| `pr_state` | `draft`, `ready` | `ready` | State of an automatically created pull request. |',
              '| `pr_state` | `draft`, `ready` | `ready` | State of the pull request created or updated after user approval. |',
          )
          replace_once(
              'SKILL.md',
              'If a matching PR exists, update its branch and body rather than creating a duplicate.',
              'If a matching PR exists, classify the candidate as an update rather than a creation; do not push to its head branch or mutate its body until the mandatory inspection gate is approved.',
          )
          replace_once(
              'SKILL.md',
              'If verified changes exist and delivery remains safe, a partial-blocked run SHOULD still push and open a clearly marked PR containing only verified work. Never deliver experimental or unverified edits.',
              'If verified changes exist and delivery remains safe, a partial-blocked run SHOULD still prepare a clearly marked, fingerprinted PR candidate containing only verified work. Push and create or update it only after explicit approval at the mandatory inspection gate. Never deliver experimental or unverified edits.',
          )
          replace_once(
              'SKILL.md',
              '- the dedicated branch was pushed to the upstream or validated fork and the upstream PR was created or updated when requested;',
              '- for `delivery=pull-request`, the exact candidate received explicit user approval, the dedicated branch was pushed to the upstream or validated fork, and the upstream PR was created or updated;',
          )

          replace_once(
              'standalone/SKILL.md',
              '| `pr_state` | `draft`, `ready` | `ready` | Pull-request state. |',
              '| `pr_state` | `draft`, `ready` | `ready` | State of the pull request created or updated after user approval. |',
          )
          replace_once(
              'standalone/SKILL.md',
              'Verified partial work may still be delivered in a clearly marked PR when delivery is safe. Experimental edits must not be delivered.',
              'Verified partial work may still be prepared as a clearly marked, fingerprinted PR candidate when delivery is safe. It may be pushed and created or updated only after explicit approval at the mandatory inspection gate. Experimental edits must not be delivered.',
          )

          Path('.github/workflows/refine-pr-approval-gate.yml').unlink()

          root = Path('.')
          lines = []
          for path in sorted(root.rglob('*'), key=lambda p: p.as_posix()):
              if not path.is_file() or '.git' in path.parts or path.as_posix() == 'CHECKSUMS.txt':
                  continue
              lines.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  ./{path.as_posix()}')
          Path('CHECKSUMS.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          PYTHON

          python3 scripts/validate_skill.py SKILL.md
          python3 scripts/validate_skill.py standalone/SKILL.md
          bash tests/test_installers.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce approval across all PR delivery paths"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
