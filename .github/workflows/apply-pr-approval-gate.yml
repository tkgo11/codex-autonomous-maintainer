name: Apply PR approval gate update

on:
  push:
    branches:
      - codex/pr-approval-gate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repository updates
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          from pathlib import Path

          root = Path('.')

          def read(path: str) -> str:
              return (root / path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              (root / path).write_text(text, encoding='utf-8', newline='\n')

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old!r}')
              write(path, text.replace(old, new, 1))

          def replace_regex_once(path: str, pattern: str, replacement: str) -> None:
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected one regex match, found {count}: {pattern!r}')
              write(path, updated)

          # OMX skill: make the approval pause a mandatory workflow state.
          replace_once(
              'SKILL.md',
              'description: "Use OMX to exhaustively improve an entire repository. Proactively discover and add verified repository-aligned features by default, apply every verified fix, refactor, deletion, or rewrite while protecting accepted behavior, then deliver the result through a dedicated pull request."',
              'description: "Use OMX to exhaustively improve an entire repository. Proactively discover and add verified repository-aligned features by default, apply every verified fix, refactor, deletion, or rewrite while protecting accepted behavior, then prepare a dedicated pull request and create or update it only after explicit user inspection and approval."',
          )
          replace_once(
              'SKILL.md',
              '- commit verified waves, push a dedicated branch, and create or update a pull request automatically.',
              '- commit verified waves, prepare dedicated-branch delivery, and create or update a pull request only after the mandatory user inspection and approval gate.',
          )
          replace_once(
              'SKILL.md',
              'After valid activation, continue automatically through deterministic work. Ask only when a product, policy, ownership, or compatibility decision cannot be derived from authoritative evidence.',
              'After valid activation, continue automatically through deterministic work except for the mandatory pre-PR user inspection gate. Outside that gate, ask only when a product, policy, ownership, or compatibility decision cannot be derived from authoritative evidence.',
          )
          replace_once(
              'SKILL.md',
              '- `delivery=pull-request` permits only a dedicated remote branch and PR after the delivery gate.',
              '- `delivery=pull-request` permits only a dedicated remote branch and PR after final verification and the mandatory pre-PR user inspection gate.',
          )
          replace_once(
              'SKILL.md',
              '- `permission_fallback=fork` authorizes automatic fork creation or reuse, fork-branch push, and a cross-repository PR to the validated upstream without another confirmation.',
              '- `permission_fallback=fork` authorizes automatic validated-fork creation or reuse and fork delivery preparation; it never bypasses the mandatory user approval required before creating or updating the cross-repository PR.',
          )
          replace_once(
              'SKILL.md',
              '- create verified commits and deliver them through a dedicated pull request without asking again.',
              '- create verified commits, prepare the exact pull-request candidate, present it for user inspection, and create or update the pull request only after explicit approval of that unchanged candidate.',
          )
          replace_once(
              'SKILL.md',
              'Resume compatible inactive work when `resume=true`. Never create duplicate active runs or duplicate PRs for the same run ID. A resumed run MUST revalidate prior evidence before relying on it.',
              'Resume compatible inactive work when `resume=true`. Never create duplicate active runs or duplicate PRs for the same run ID. A resumed run MUST revalidate prior evidence before relying on it. If durable state is `awaiting-user-pr-approval`, resume at the inspection gate and invalidate the pending approval candidate whenever its base, head, diff, verification evidence, delivery topology, title, body, or draft state changed.',
          )

          omx_delivery = '''## 25. Branch Delivery and Pre-PR User Inspection

When `delivery=branch` or `delivery=pull-request`, select the delivery topology after the final verification wave. Activation plus the delivery option authorizes delivery preparation and automatic branch-only delivery; it does not authorize creating or updating a pull request without explicit user approval for the exact current candidate.

1. Check authenticated write permission on the canonical upstream.
2. If upstream is writable, select the dedicated upstream branch and same-repository topology.
3. If upstream is not writable and `permission_fallback=fork`, automatically create or reuse the authenticated account's fork. Validate that its parent or source repository is the canonical upstream; never use an unrelated repository with the same name.
4. Preserve the canonical repository as the upstream/base remote and use the fork only as the delivery/head remote. Do not rewrite unrelated remote configuration; add or select an unambiguous remote name such as `fork` when needed.
5. Verify that the run branch descends from the recorded upstream base. If the fork's default branch is stale, synchronize it safely by fast-forward or prepare the dedicated run branch directly from the upstream base; never force-push or rewrite published fork history.
6. Search same-repository and cross-repository heads for an equivalent active PR so the candidate is classified as `create` or `update`, never duplicated.
7. For `delivery=branch`, push the dedicated run branch without force, record delivery metadata, and finish without a PR.
8. For `delivery=pull-request`, do not push the candidate branch and do not call any PR-creation or PR-update operation until the following gate is approved.

### Mandatory inspection packet

Prepare an immutable PR candidate and present the user with:

- whether the action will create a new PR or update an existing one;
- canonical upstream, delivery repository, authenticated account, permission result, and direct-or-fork mode;
- exact base and head repositories, branches, and SHAs;
- commit list, changed-file list, diffstat, and a concise material-diff summary;
- implemented features, fixes, refactors, deletions, replacements, migrations, and compatibility effects;
- all verification commands and results, including failures, skips, flakes, timeouts, unavailable checks, environment limits, and remaining blind spots;
- security, migration, performance, rollback, and review risks;
- proposed PR title, complete PR body, and `pr_state`;
- a candidate fingerprint covering base SHA, head SHA, diff hash, verification-evidence hash, delivery topology, title, body, and draft state.

Ask the user to explicitly approve or reject that exact candidate. Initial skill activation, the original `delivery=pull-request` option, silence, unrelated acknowledgement, or approval of an older candidate MUST NOT count as approval.

Persist the packet and fingerprint in `delivery.json`, set the durable run state to `awaiting-user-pr-approval`, release any nonessential live lock, and return the inspection packet without pushing or creating/updating a PR.

Approval is valid only for the displayed fingerprint. Before acting on approval, reacquire ownership and revalidate repository identity, user work, base and head SHAs, diff, verification evidence, delivery topology, existing-PR status, title, body, and draft state. Any difference invalidates approval and requires a fresh inspection packet.

After valid explicit approval:

1. push the dedicated run branch without force to the selected delivery repository;
2. create or update the PR in the canonical upstream repository targeting its discovered default branch;
3. in direct mode, use the dedicated upstream branch as the head;
4. in fork mode, use `<authenticated-login>:<dedicated-branch>` and enable maintainer edits when supported;
5. set draft state from `pr_state`;
6. use the approved title and body, including summary, deleted and replaced architecture, observable-output corpus, tests, analysis, benchmarks, risks, migrations, blocked findings, rollback, blind spots, environment-limited checks, and direct-or-fork mode;
7. attach labels or reviewers only when repository policy authorizes them;
8. record the approval fingerprint, approval evidence, upstream repository, delivery repository, authenticated account, permission result, delivery mode, fork identity, PR URL, number, head SHA, and base SHA in `delivery.json`.

If the user rejects the candidate or requests changes, do not create or update the PR. Apply authorized changes, rerun affected verification and the final gate, then present a new fingerprinted packet. The user may instead choose `delivery=branch` or `delivery=none`.

If upstream is not writable and fork creation, fork push, or cross-repository PR creation is unavailable, record the exact failed capability and return `partial-blocked`; do not silently downgrade to report-only or ask the user to perform routine fork steps manually.

Never merge the PR automatically.'''
          replace_regex_once(
              'SKILL.md',
              r'## 25\. Automatic Branch Push and Pull Request\n.*?\n## 26\.',
              omx_delivery + '\n\n## 26.',
          )
          replace_once(
              'SKILL.md',
              '- current epoch and clean-scan count;\n- upstream, delivery repository, permission mode, fork, branch, commit, and PR state.',
              '- current epoch and clean-scan count;\n- upstream, delivery repository, permission mode, fork, branch, commit, PR candidate fingerprint, and approval state.',
          )
          replace_once(
              'SKILL.md',
              '- `report-only`;\n- `resume-required`;',
              '- `report-only`;\n- `awaiting-user-pr-approval`;\n- `resume-required`;',
          )
          replace_once(
              'SKILL.md',
              '  -> SELECT DIRECT OR FORK DELIVERY -> PUSH DEDICATED BRANCH\n  -> CREATE/UPDATE UPSTREAM PR -> FINAL REPORT',
              '  -> SELECT DIRECT OR FORK DELIVERY -> PREPARE PR CANDIDATE\n  -> USER INSPECTION -> AWAIT EXPLICIT APPROVAL\n  -> REVALIDATE CANDIDATE -> PUSH DEDICATED BRANCH\n  -> CREATE/UPDATE UPSTREAM PR -> FINAL REPORT',
          )
          replace_once(
              'SKILL.md',
              'At every transition, persist state, verify preconditions, and continue automatically when safe and deterministic.',
              'At every transition, persist state and verify preconditions. Continue automatically when safe and deterministic except at the mandatory pre-PR user inspection gate.',
          )
          replace_once(
              'SKILL.md',
              '- “Verified changes were pushed and pull request #N was created against the upstream repository.”',
              '- “The verified PR candidate is awaiting explicit user approval under fingerprint F; no branch was pushed and no pull request was created or updated.”\n- “Verified changes were pushed and pull request #N was created against the upstream repository after approval of fingerprint F.”',
          )
          replace_once(
              'SKILL.md',
              '- “The upstream was read-only, so the verified branch was pushed to the validated fork and pull request #N was created upstream.”',
              '- “The upstream was read-only, so after approval of fingerprint F the verified branch was pushed to the validated fork and pull request #N was created upstream.”',
          )

          # Standalone skill: equivalent mandatory approval state without OMX dependencies.
          replace_once(
              'standalone/SKILL.md',
              'description: "Use Codex built-in capabilities to exhaustively improve an entire repository. Proactively discover and add verified repository-aligned features by default, apply every verified fix, refactor, deletion, or rewrite while protecting accepted behavior, then deliver the result through a dedicated pull request."',
              'description: "Use Codex built-in capabilities to exhaustively improve an entire repository. Proactively discover and add verified repository-aligned features by default, apply every verified fix, refactor, deletion, or rewrite while protecting accepted behavior, then prepare a dedicated pull request and create or update it only after explicit user inspection and approval."',
          )
          replace_once(
              'standalone/SKILL.md',
              '- commit verified waves, push a dedicated branch, and create or update a pull request automatically.',
              '- commit verified waves, prepare dedicated-branch delivery, and create or update a pull request only after the mandatory user inspection and approval gate.',
          )
          replace_once(
              'standalone/SKILL.md',
              'Continue automatically through safe deterministic actions. Block rather than guess when a product, policy, ownership, or compatibility decision cannot be derived from authoritative evidence.',
              'Continue automatically through safe deterministic actions except for the mandatory pre-PR user inspection gate. Block rather than guess when a product, policy, ownership, or compatibility decision cannot be derived from authoritative evidence.',
          )
          replace_once(
              'standalone/SKILL.md',
              '- `permission_fallback=fork` authorizes automatic fork creation or reuse, fork-branch push, and a cross-repository PR to the validated upstream without another confirmation.',
              '- `permission_fallback=fork` authorizes automatic validated-fork creation or reuse and fork delivery preparation; it never bypasses the mandatory user approval required before creating or updating the cross-repository PR.',
          )
          replace_once(
              'standalone/SKILL.md',
              '- deliver verified work through a dedicated pull request without asking again.',
              '- prepare the exact pull-request candidate, present it for user inspection, and create or update the pull request only after explicit approval of that unchanged candidate.',
          )
          replace_once(
              'standalone/SKILL.md',
              'Resume compatible inactive work when `resume=true`. Never create duplicate active runs or duplicate pull requests for the same run ID. Revalidate prior evidence after repository, dependency, tool, upstream, or fork changes.',
              'Resume compatible inactive work when `resume=true`. Never create duplicate active runs or duplicate pull requests for the same run ID. Revalidate prior evidence after repository, dependency, tool, upstream, or fork changes. If durable state is `awaiting-user-pr-approval`, resume at the inspection gate and invalidate the pending candidate whenever its base, head, diff, verification evidence, delivery topology, title, body, or draft state changed.',
          )

          standalone_delivery = '''## 20. Commit, Branch Delivery, and Pre-PR User Inspection

For `commit=checkpoint`, commit each verified wave. For `commit=final`, commit once after the final gate. For `commit=false`, disable delivery.

Stage explicit owned paths and inspect staged diffs. Never push the default branch or force-push.

After final verification, validate the canonical upstream, default branch, authenticated account, upstream permission, run-branch ancestry, existing validated fork, and equivalent active same-repository or cross-repository PRs. Select direct delivery when upstream is writable; otherwise, with `permission_fallback=fork`, create or reuse only an authenticated fork whose parent or source is the canonical upstream. Preserve upstream as the base remote and the fork only as the head remote.

For `delivery=branch`, push the dedicated run branch without force and record delivery metadata.

For `delivery=pull-request`, activation and the delivery option authorize preparation only. Do not push the candidate branch and do not call any PR-creation or PR-update operation before explicit approval at this gate.

Present an immutable inspection packet containing whether the action is PR creation or update; upstream, delivery repository, account, permission and direct-or-fork mode; exact base/head refs and SHAs; commits, changed files, diffstat, and material diff summary; features, fixes, refactors, deletions, replacements, migrations, and compatibility effects; every check result including failures, skips, flakes, timeouts, unavailable checks, environment limits, and blind spots; risks and rollback; proposed title, complete body, and `pr_state`; and a fingerprint over the base SHA, head SHA, diff, verification evidence, topology, title, body, and draft state.

Ask the user to explicitly approve or reject that exact candidate. Initial activation, `delivery=pull-request`, silence, unrelated acknowledgement, or approval of an older candidate is not approval. Persist the packet and fingerprint in `delivery.json`, set state to `awaiting-user-pr-approval`, release any nonessential live lock, and return without pushing or creating/updating a PR.

Before acting on approval, reacquire ownership and revalidate repository identity, user work, refs, diff, evidence, topology, existing-PR status, title, body, and draft state. Any change invalidates approval and requires a new packet.

After valid approval, push the dedicated branch without force, then create or update the PR in the canonical upstream against its default branch. Use the upstream branch as head in direct mode or `<authenticated-login>:<dedicated-branch>` in fork mode, enable maintainer edits when supported, apply the approved draft state, title, and body, and record approval evidence plus full PR metadata. Search both topology forms first so resume updates instead of duplicates.

If the user rejects or requests changes, do not create or update the PR. Apply authorized revisions, rerun affected verification and the final gate, then present a new fingerprinted packet. The user may instead choose `delivery=branch` or `delivery=none`.

If fork creation, push, or cross-repository PR creation is unavailable, record the exact capability failure and return `partial-blocked`; do not silently downgrade or ask the user to perform routine fork steps manually.

Never merge it automatically.'''
          replace_regex_once(
              'standalone/SKILL.md',
              r'## 20\. Commit and Remote Delivery\n.*?\n## 21\.',
              standalone_delivery + '\n\n## 21.',
          )
          replace_once(
              'standalone/SKILL.md',
              '- the dedicated branch was pushed to the upstream or validated fork and the upstream PR was created or updated when requested.',
              '- for `delivery=pull-request`, the exact candidate received explicit user approval, the dedicated branch was pushed to the upstream or validated fork, and the upstream PR was created or updated.',
          )
          replace_once(
              'standalone/SKILL.md',
              'Allowed results are `complete`, `partial-blocked`, `report-only`, `resume-required`, `cancelled`, and `environment-error`.',
              'Allowed results are `complete`, `partial-blocked`, `report-only`, `awaiting-user-pr-approval`, `resume-required`, `cancelled`, and `environment-error`.',
          )
          replace_once(
              'standalone/SKILL.md',
              '  -> SELECT DIRECT OR FORK DELIVERY -> PUSH RUN BRANCH\n  -> CREATE/UPDATE UPSTREAM PR -> FINAL REPORT',
              '  -> SELECT DIRECT OR FORK DELIVERY -> PREPARE PR CANDIDATE\n  -> USER INSPECTION -> AWAIT EXPLICIT APPROVAL\n  -> REVALIDATE CANDIDATE -> PUSH RUN BRANCH\n  -> CREATE/UPDATE UPSTREAM PR -> FINAL REPORT',
          )
          replace_once(
              'standalone/SKILL.md',
              'At every transition, persist state and continue automatically when safe and deterministic.',
              'At every transition, persist state. Continue automatically when safe and deterministic except at the mandatory pre-PR user inspection gate.',
          )
          replace_once(
              'standalone/SKILL.md',
              '- “Verified changes were pushed and pull request #N was created against the upstream repository.”',
              '- “The verified PR candidate is awaiting explicit user approval under fingerprint F; no branch was pushed and no pull request was created or updated.”\n- “Verified changes were pushed and pull request #N was created against the upstream repository after approval of fingerprint F.”',
          )
          replace_once(
              'standalone/SKILL.md',
              '- “The upstream was read-only, so the verified branch was pushed to the validated fork and pull request #N was created upstream.”',
              '- “The upstream was read-only, so after approval of fingerprint F the verified branch was pushed to the validated fork and pull request #N was created upstream.”',
          )

          # Public documentation and examples.
          replace_once(
              'README.md',
              'Two repository-wide maintenance skills that proactively add verified, repository-aligned features by default, aggressively discover and apply other verifiable improvements, allow large refactors or complete rewrites when accepted observable behavior remains equivalent, and automatically deliver verified work through a dedicated branch and pull request.',
              'Two repository-wide maintenance skills that proactively add verified, repository-aligned features by default, aggressively discover and apply other verifiable improvements, allow large refactors or complete rewrites when accepted observable behavior remains equivalent, and require user inspection and explicit approval immediately before dedicated-branch pull-request delivery.',
          )
          replace_once('README.md', '## New default behavior in 2.1', '## New default behavior in 2.2')
          replace_once(
              'README.md',
              '- pushes that branch and creates or updates a pull request automatically after verification;',
              '- prepares a fingerprinted PR candidate after verification, shows the complete inspection packet, and pauses until the user explicitly approves it;',
          )
          replace_once(
              'README.md',
              'Automatic delivery is limited to a dedicated run branch and a pull request. It does not push to the default branch or merge the PR. Delivery is skipped or marked blocked when repository identity, write permission, secret scanning, verification, branch safety, or PR-target checks fail. Use `pr_state=draft` for additional human review or `delivery=none` to keep all work local.',
              'Branch-only delivery remains automatic, but pull-request delivery has a mandatory human gate. Before any candidate branch push or PR create/update operation, the skill shows the exact base/head refs and SHAs, commits, changed files and diff summary, verification results and blind spots, risks and rollback, delivery topology, proposed title/body, draft state, and a candidate fingerprint. It then returns `awaiting-user-pr-approval`. Only an explicit approval of that unchanged fingerprint allows the branch push and PR operation. The skill never pushes to the default branch or merges the PR. Use `pr_state=draft` for additional review after creation or `delivery=none` to keep all work local.',
          )
          insert_before = '## Install\n'
          readme = read('README.md')
          if readme.count(insert_before) != 1:
              raise SystemExit('README.md: Install heading not found exactly once')
          approval_docs = '''## Required pre-PR inspection\n\nFor `delivery=pull-request`, the initial invocation is not approval. After all implementation, verification, review, and convergence work is complete, the run prepares an immutable candidate and pauses. Approve only after checking the displayed fingerprinted packet. Any later change to the base, head, diff, checks, topology, title, body, or draft state invalidates the approval and forces a new inspection. Rejecting the candidate leaves the PR unopened; requested revisions are applied and re-presented after verification.\n\n'''
          write('README.md', readme.replace(insert_before, approval_docs + insert_before, 1))

          replace_once(
              'examples/invocations.md',
              '## Default aggressive transformation and automatic PR',
              '## Default aggressive transformation and user-approved PR',
          )
          replace_once(
              'examples/invocations.md',
              'The default proactively originates and implements repository-aligned features that pass its evidence, acceptance, compatibility, verification, and rollback gates. It may also replace modules, dependencies, architecture, or the entire implementation when differential verification proves accepted observable behavior is preserved. Verified commits are pushed to a dedicated branch and a ready-for-review PR is created or updated automatically. It never merges the PR.',
              'The default proactively originates and implements repository-aligned features that pass its evidence, acceptance, compatibility, verification, and rollback gates. It may also replace modules, dependencies, architecture, or the entire implementation when differential verification proves accepted observable behavior is preserved. After final verification it presents a fingerprinted PR inspection packet and returns `awaiting-user-pr-approval`. Only explicit approval of that unchanged candidate permits the dedicated-branch push and ready-for-review PR creation or update. It never merges the PR.',
          )
          replace_once(
              'examples/invocations.md',
              'Use this default only when broad autonomous changes and automatic PR delivery are intended. Start with `mode=report`, `rewrite_policy=surgical`, `pr_state=draft`, or `delivery=none` when the repository contract or desired scope is uncertain.',
              'Use this default only when broad autonomous changes and user-approved PR delivery are intended. Start with `mode=report`, `rewrite_policy=surgical`, `pr_state=draft`, or `delivery=none` when the repository contract or desired scope is uncertain.',
          )
          examples = read('examples/invocations.md')
          marker = '## Draft PR\n'
          if examples.count(marker) != 1:
              raise SystemExit('examples/invocations.md: Draft PR heading not found exactly once')
          approval_example = '''## Approve the prepared candidate\n\nWhen the run returns `awaiting-user-pr-approval`, inspect the displayed base/head, diff summary, checks, risks, title, body, draft state, and fingerprint. Reply with an explicit approval that identifies the current candidate. A previous approval or a generic acknowledgement does not authorize a changed candidate.\n\n'''
          write('examples/invocations.md', examples.replace(marker, approval_example + marker, 1))

          replace_once(
              'examples/AGENTS.md.snippet',
              '- Start with `mode=report` when authority, product intent, or safety boundaries are unclear.',
              '- Start with `mode=report` when authority, product intent, or safety boundaries are unclear.\n- For `delivery=pull-request`, require the fingerprinted inspection packet and explicit approval of the unchanged candidate before any candidate-branch push or PR creation/update.',
          )

          # Validation contract, release metadata, and changelog.
          replace_once(
              'scripts/validate_skill.py',
              '    "resume-required",\n]',
              '    "resume-required",\n    "awaiting-user-pr-approval",\n    "explicit user approval",\n]',
          )
          write('VERSION', '2.2.0\n')
          changelog = read('CHANGELOG.md')
          changelog_entry = '''## 2.2.0 — 2026-07-30\n\n- Added a mandatory fingerprinted user-inspection gate immediately before pull-request delivery in both skill variants.\n- Added the durable `awaiting-user-pr-approval` state; initial invocation, silence, generic acknowledgement, or approval of an older candidate no longer authorizes PR creation or update.\n- The inspection packet now includes delivery topology, exact base/head refs and SHAs, commits, changed files, diff summary, verification failures and blind spots, risks, rollback, proposed title/body, draft state, and a candidate fingerprint.\n- Any change to the candidate invalidates approval and requires a fresh inspection; rejected candidates remain unopened and may be revised or downgraded to branch-only/local delivery.\n- Updated documentation, examples, validation requirements, version metadata, and package checksums.\n\n'''
          if not changelog.startswith('# Changelog\n\n'):
              raise SystemExit('CHANGELOG.md: unexpected header')
          write('CHANGELOG.md', '# Changelog\n\n' + changelog_entry + changelog[len('# Changelog\n\n'):])

          # Remove this one-shot workflow before committing the finished repository state.
          Path('.github/workflows/apply-pr-approval-gate.yml').unlink()

          # Regenerate package checksums after all edits and after removing the one-shot workflow.
          checksum_lines = []
          for path in sorted(root.rglob('*'), key=lambda p: p.as_posix()):
              if not path.is_file() or '.git' in path.parts or path.as_posix() == 'CHECKSUMS.txt':
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              checksum_lines.append(f'{digest}  ./{path.as_posix()}')
          write('CHECKSUMS.txt', '\n'.join(checksum_lines) + '\n')
          PY

          python3 scripts/validate_skill.py SKILL.md
          python3 scripts/validate_skill.py standalone/SKILL.md
          bash tests/test_installers.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: require user approval before PR delivery"
          git push origin "HEAD:${GITHUB_REF_NAME}"
